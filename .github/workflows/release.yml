name: Release

# Push a tag such as v0.1.0 (it must match fungus_cv.__version__) to build the installers
# for every platform and attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    with:
      skip-build: true

  build:
    needs: test
    uses: ./.github/workflows/build.yml
    with:
      with-models: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: installers/*
          generate_release_notes: true
