name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OpenCV system libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libegl1
          libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install -e ".[dev,gui]" pytest-qt
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: CLI smoke test
        run: |
          fungus --version
          fungus init smoke-experiment
          fungus status smoke-experiment
