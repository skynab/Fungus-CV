name: Build installers

# Reusable: builds the app and an installer on Windows, macOS and Linux and uploads them as
# workflow artifacts. Called by ci.yml (no models, fast) and release.yml (with models).
on:
  workflow_call:
    inputs:
      with-models:
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos
          - os: ubuntu-24.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      MODELS_FLAG: ${{ inputs.with-models && '--with-models' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, "src")
          from fungus_cv import __version__
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{__version__}":
              sys.exit(f"tag {tag} does not match fungus_cv.__version__ {__version__}")

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libegl1
          libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4
          libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0

      - name: Install CPU-only PyTorch (Linux/Windows)
        if: inputs.with-models && runner.os != 'macOS'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install
        run: python -m pip install -e ".[app${{ inputs.with-models && ',sam' || '' }}]"

      - name: Build app
        run: python packaging/build_app.py ${{ env.MODELS_FLAG }}

      - name: Install WiX
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 5.0.2

      - name: Package (Windows .msi)
        if: runner.os == 'Windows'
        run: python packaging/build_msi.py

      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0,'src'); from fungus_cv import __version__; print(__version__)")
          hdiutil create -volname "Fungus-CV" -srcfolder dist/Fungus-CV.app -ov -format UDZO \
            "dist/Fungus-CV-${VERSION}-macos.dmg"

      - name: Package (Linux .tar.gz)
        if: runner.os == 'Linux'
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0,'src'); from fungus_cv import __version__; print(__version__)")
          tar -C dist -czf "dist/Fungus-CV-${VERSION}-linux-x64.tar.gz" Fungus-CV

      - uses: actions/upload-artifact@v7
        with:
          name: fungus-cv-${{ matrix.name }}${{ inputs.with-models && '-models' || '' }}
          path: |
            dist/*.msi
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error
