name: Release

# Push a tag such as v0.1.0 (it must match fungus_cv.__version__) to build the installers
# for every platform and attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        shell: python
        run: |
          import os, re, sys
          sys.path.insert(0, "src")
          from fungus_cv import __version__
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{__version__}":
              sys.exit(f"tag {tag} does not match fungus_cv.__version__ {__version__}")

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0 libegl1
          libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libxcb-icccm4
          libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0

      - name: Install CPU-only PyTorch (Linux/Windows)
        if: runner.os != 'macOS'
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install
        run: python -m pip install -e ".[app,sam]"

      - name: Build app with SAM 2 / model support
        run: python packaging/build_app.py --with-models

      - name: Install WiX
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 4.0.5

      - name: Package (Windows .msi)
        if: runner.os == 'Windows'
        run: python packaging/build_msi.py

      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0,'src'); from fungus_cv import __version__; print(__version__)")
          hdiutil create -volname "Fungus-CV" -srcfolder dist/Fungus-CV.app -ov -format UDZO \
            "dist/Fungus-CV-${VERSION}-macos.dmg"

      - name: Package (Linux .tar.gz)
        if: runner.os == 'Linux'
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0,'src'); from fungus_cv import __version__; print(__version__)")
          tar -C dist -czf "dist/Fungus-CV-${VERSION}-linux-x64.tar.gz" Fungus-CV

      - uses: actions/upload-artifact@v4
        with:
          name: fungus-cv-${{ matrix.name }}
          path: |
            dist/*.msi
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
